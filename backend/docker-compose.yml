services:
  postgres:
    image: postgres:16-alpine
    container_name: buddy-postgres
    environment:
      POSTGRES_USER: buddy
      POSTGRES_PASSWORD: buddy
      POSTGRES_DB: buddy
    ports:
      # 5433 de propósito: a 5432 já é do stack do biahflow-portal-cliente.
      # Dois projetos disputando a mesma porta é o bug que custou uma tarde.
      - '5433:5432'
    volumes:
      - buddy_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U buddy -d buddy']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  buddy_pgdata:
